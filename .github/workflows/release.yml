name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build TaskbarFetch
        shell: cmd
        run: Build.cmd

      - name: Package release
        shell: powershell
        run: |
          $tag = "${{ github.ref_name }}"
          $stage = Join-Path $PWD "release-stage\TaskbarFetch"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null

          Copy-Item .\dist\TaskbarFetch.exe $stage
          Copy-Item .\Install.cmd $stage
          Copy-Item .\Install.ps1 $stage
          Copy-Item .\Uninstall.cmd $stage
          Copy-Item .\Uninstall.ps1 $stage
          Copy-Item .\README.md $stage
          Copy-Item .\LICENSE $stage

          $zip = Join-Path $PWD "TaskbarFetch-$tag-windows.zip"
          Compress-Archive -Path "$stage\*" -DestinationPath $zip -Force

          $exeHash = (Get-FileHash .\dist\TaskbarFetch.exe -Algorithm SHA256).Hash.ToLower()
          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          @(
            "$exeHash  TaskbarFetch.exe",
            "$zipHash  $(Split-Path $zip -Leaf)"
          ) | Set-Content .\SHA256SUMS.txt -Encoding ascii

      - name: Create GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            ".\TaskbarFetch-${{ github.ref_name }}-windows.zip" `
            ".\dist\TaskbarFetch.exe" `
            ".\SHA256SUMS.txt" `
            --title "TaskbarFetch ${{ github.ref_name }}" `
            --generate-notes
