name: TaskbarFetch Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build TaskbarFetch
        shell: cmd
        run: TaskbarFetch-Portable-Build.cmd

      - name: Run geometry unit tests
        shell: pwsh
        run: |
          dotnet restore .\tests\TaskbarFetch.GeometryTests\TaskbarFetch.GeometryTests.csproj --locked-mode
          dotnet test .\tests\TaskbarFetch.GeometryTests\TaskbarFetch.GeometryTests.csproj --configuration Release --no-restore

      - name: Install Inno Setup compiler
        shell: pwsh
        run: .\scripts\Install-InnoSetupForBuild.ps1

      - name: Build TaskbarFetch setup program
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $version = $env:TAG_NAME.Substring(1)
          .\TaskbarFetch-Setup-Build.cmd -Version $version -CompilerPath "$env:TASKBARFETCH_ISCC"

      - name: Test installer install and uninstall behavior
        shell: pwsh
        run: .\tests\InstallerLifecycle.ps1

      - name: Package release
        shell: powershell
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $tag = $env:TAG_NAME
          if ($tag -notmatch '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Release tag must use semantic versioning: vX.Y.Z or vX.Y.Z-prerelease."
          }

          . .\scripts\TaskbarFetch-Version.ps1
          $versionInfo = Get-TaskbarFetchVersion -RepositoryRoot $PWD.Path
          $releaseVersion = $versionInfo.InformationalVersion
          if ($tag -ne "v$releaseVersion") {
            throw "The release tag $tag must match TaskbarFetchVersion '$releaseVersion' in Directory.Build.props."
          }

          $setup = Join-Path $PWD $versionInfo.SetupFileName
          $portableName = $versionInfo.PortableFileName
          $portable = Join-Path $PWD $portableName
          if (-not (Test-Path -LiteralPath $setup -PathType Leaf)) {
            throw "The setup program for $tag was not built."
          }
          if (-not (Test-Path -LiteralPath $portable -PathType Leaf)) {
            throw "The versioned portable app for $tag was not built."
          }

          $stage = Join-Path $PWD "release-stage\TaskbarFetch"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          $docs = Join-Path $stage "docs"
          New-Item -ItemType Directory -Path $docs -Force | Out-Null
          $assets = Join-Path $stage "assets"
          New-Item -ItemType Directory -Path $assets -Force | Out-Null

          Copy-Item $portable $stage
          Copy-Item .\README.md $stage
          Copy-Item .\LICENSE $stage
          Copy-Item .\AUTHORS.md $stage
          Copy-Item .\CHANGELOG.md $stage
          Copy-Item .\CITATION.cff $stage
          Copy-Item .\CONTRIBUTING.md $stage
          Copy-Item .\SECURITY.md $stage
          Copy-Item .\THIRD_PARTY_NOTICES.md $stage
          Copy-Item .\docs\ARCHITECTURE.md $docs
          Copy-Item .\docs\TESTING.md $docs
          Copy-Item .\assets\* $assets

          $zip = Join-Path $PWD "TaskbarFetch-$tag-windows-portable.zip"
          Compress-Archive -Path "$stage\*" -DestinationPath $zip -Force

          $setupHash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          $exeHash = (Get-FileHash $portable -Algorithm SHA256).Hash.ToLower()
          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          @(
            "$setupHash  $(Split-Path $setup -Leaf)",
            "$exeHash  $portableName",
            "$zipHash  $(Split-Path $zip -Leaf)"
          ) | Set-Content .\SHA256SUMS.txt -Encoding ascii

          $escapedVersion = [regex]::Escape($releaseVersion)
          $changelog = Get-Content .\CHANGELOG.md -Raw
          $changelogHeader = [regex]::Match(
            $changelog,
            "(?m)^## \[$escapedVersion\] - (?<date>\d{4}-\d{2}-\d{2})\s*$"
          )
          if (-not $changelogHeader.Success) {
            throw "CHANGELOG.md must contain a dated section for $releaseVersion."
          }
          $releaseDate = $changelogHeader.Groups['date'].Value
          $changelogPattern = "(?ms)^## \[$escapedVersion\].*?(?=^## \[|\z)"
          $changelogSection = [regex]::Match($changelog, $changelogPattern)
          if (-not $changelogSection.Success) {
            throw "CHANGELOG.md does not contain a section for $releaseVersion."
          }

          $citation = Get-Content .\CITATION.cff -Raw
          $citationVersion = [regex]::Match($citation, '(?m)^version:\s*(?<value>[^#\s]+)\s*$')
          $citationDate = [regex]::Match($citation, '(?m)^date-released:\s*(?<date>\d{4}-\d{2}-\d{2})\s*$')
          if (-not $citationVersion.Success -or $citationVersion.Groups['value'].Value -ne $releaseVersion) {
            throw "CITATION.cff version must match $releaseVersion before publishing."
          }
          if (-not $citationDate.Success -or $citationDate.Groups['date'].Value -ne $releaseDate) {
            throw "CITATION.cff date-released must match the dated $releaseVersion changelog section."
          }

          $readme = Get-Content .\README.md -Raw
          $preReleaseLabel = if ($releaseVersion.Contains('-')) { ' \(pre-release\)' } else { '' }
          $releaseStatusPattern = "(?m)^> \*\*Latest GitHub release: v$escapedVersion$preReleaseLabel\.\*\*"
          if ($readme -notmatch $releaseStatusPattern) {
            throw "README.md must identify v$releaseVersion as the latest GitHub release before publishing."
          }

          $releaseNotes = @"
          $($changelogSection.Value.Trim())

          ### Report a bug

          If TaskbarFetch does not behave as expected, please [open a GitHub bug report](https://github.com/ThyannSeng/TaskbarFetch/issues/new?template=bug_report.yml). Include your Windows version, monitor layout, and steps to reproduce. Do not include private window titles or sensitive log content.
          "@
          Set-Content .\release-notes.md -Value $releaseNotes -Encoding UTF8

      - name: Create GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $tag = $env:TAG_NAME
          . .\scripts\TaskbarFetch-Version.ps1
          $versionInfo = Get-TaskbarFetchVersion -RepositoryRoot $PWD.Path
          if ($tag -ne "v$($versionInfo.InformationalVersion)") {
            throw "The release tag $tag does not match the configured TaskbarFetch version."
          }
          $releaseArgs = @(
            "release", "create", $tag,
            ".\$($versionInfo.SetupFileName)",
            ".\TaskbarFetch-$tag-windows-portable.zip",
            ".\$($versionInfo.PortableFileName)",
            ".\SHA256SUMS.txt",
            "--title", "TaskbarFetch $tag",
            "--notes-file", ".\release-notes.md"
          )
          if ($tag.Contains("-")) {
            $releaseArgs += "--prerelease"
          }
          gh @releaseArgs
